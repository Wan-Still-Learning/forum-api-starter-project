# .github/workflows/ci.yml

name: Continuous Integration

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test-app:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: forum_api_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d forum_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' 

      - name: Install Dependencies
        run: npm install

      - name: Create Test Database
        env:
          PGHOST_TEST: localhost
          PGPORT_TEST: 5432
          PGUSER_TEST: root
          PGPASSWORD_TEST: root
          PGDATABASE_TEST: postgres 
          
          ACCESS_TOKEN_KEY: 'dummykey'
          REFRESH_TOKEN_KEY: 'dummyrefreshkey'
          ACCESS_TOKEN_AGE: 3600
        run: npm run db:create:test 

      - name: Run Migrations
        env:
          PGHOST_TEST: localhost
          PGPORT_TEST: 5432
          PGUSER_TEST: root
          PGPASSWORD_TEST: root
          PGDATABASE_TEST: forum_api_test 
          
          ACCESS_TOKEN_KEY: 'dummykey'
          REFRESH_TOKEN_KEY: 'dummyrefreshkey'
          ACCESS_TOKEN_AGE: 3600
        run: npm run migrate:test

      - name: Run Tests
        env:
          PGHOST_TEST: localhost
          PGPORT_TEST: 5432
          PGUSER_TEST: root
          PGPASSWORD_TEST: root
          PGDATABASE_TEST: forum_api_test
          
          ACCESS_TOKEN_KEY: 'dummykey'
          REFRESH_TOKEN_KEY: 'dummyrefreshkey'
          ACCESS_TOKEN_AGE: 3600
        run: npm run test