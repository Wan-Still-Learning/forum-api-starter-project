# Kriteria 3: Definisikan zona Rate Limiting
# Menyimpan IP (10m) dengan rate 90 request/menit
http {
    limit_req_zone $binary_remote_addr zone=forum_api_limit:10m rate=90r/m;
    
    # Hapus/tambahkan 'include' lain sesuai kebutuhan server Anda
    include /etc/nginx/mime.types;
    
    server {
        listen 80;
        listen [::]:80;
        
        # Domain yang akan digunakan untuk Kriteria 4
        server_name apiforum.wandhx.site; 

        # Lokasi default (untuk semua endpoint selain /threads)
        location / {
            # Arahkan (proxy) request ke Hapi server Anda
            proxy_pass http://localhost:5000; # Menggunakan port 5000 dari Postman env
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Kriteria 3: Lokasi spesifik untuk /threads
        # regex '~ ^/threads(/.*)?$' akan mencocokkan /threads DAN /threads/xyz
        location ~ ^/threads(/.*)?$ {
            # Terapkan zona 'forum_api_limit'
            limit_req zone=forum_api_limit burst=30 nodelay;

            # Pengaturan proxy yang sama harus diulang di dalam blok ini
            proxy_pass http://localhost:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}